<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swaply</title>
<style>
  :root{
    --bg:#040A08; --panel:#0A1612; --panel2:#0D1D17; --line:rgba(77,255,145,.24); --line2:rgba(255,255,255,.09);
    --neon:#4DFF91; --neon2:#2FE57A; --ink:#E9F6EF; --muted:#8FAB9E; --warn:#F2D98B; --bad:#FF8A78; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1100px 480px at 72% -8%, rgba(77,255,145,.11), transparent 62%), var(--bg);
    color:var(--ink); font:15px/1.5 Inter,"Segoe UI",system-ui,-apple-system,sans-serif; min-height:100vh;
    color-scheme:dark;
  }
  button{font:inherit; color:inherit; cursor:pointer}
  svg.i{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
  button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--neon); outline-offset:2px}
  button:disabled{opacity:.5; cursor:not-allowed}

  /* ---------- layout ---------- */
  .app{display:grid; grid-template-columns:210px minmax(0,1fr) 330px; grid-template-areas:"top top top" "side main rail"; min-height:100vh}
  .top{grid-area:top; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line2)}
  .side{grid-area:side; padding:16px 12px; border-inline-end:1px solid var(--line2); display:flex; flex-direction:column; gap:6px}
  main{grid-area:main; padding:16px; display:flex; flex-direction:column; gap:16px; min-width:0}
  .rail{grid-area:rail; padding:16px 16px 16px 0; display:flex; flex-direction:column; gap:16px; min-width:0}
  @media (max-width:1180px){
    .app{grid-template-columns:200px minmax(0,1fr); grid-template-areas:"top top" "side main" "side rail"}
    .rail{padding:0 16px 16px}
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr; grid-template-areas:"top" "main" "rail"; padding-bottom:76px}
    .side{position:fixed; inset:auto 0 0 0; z-index:5; flex-direction:row; justify-content:space-around; padding:8px 10px; background:rgba(4,10,8,.96); border-top:1px solid var(--line); border-inline-end:0; backdrop-filter:blur(8px)}
    .tag{display:none}
    main{padding:12px}
    .rail{padding:0 12px 12px}
  }

  /* ---------- header ---------- */
  .brand{display:flex; align-items:center; gap:10px; min-width:0}
  .wm{font-weight:800; font-size:22px; letter-spacing:.02em}
  .wm b{color:var(--neon)}
  .tag{color:var(--muted); font-size:14px; padding-inline-start:14px; border-inline-start:1px solid var(--line2)}
  .topr{display:flex; align-items:center; gap:10px}
  .netsel{display:flex; align-items:center; gap:8px; border:1px solid var(--line2); background:var(--panel); border-radius:12px; padding:6px 10px}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--neon); box-shadow:0 0 10px var(--neon)}
  .netsel select{background:transparent; color:var(--ink); border:0; font:inherit; font-size:14px; max-width:130px}
  #wallet{display:flex; align-items:center; gap:8px; border:0; border-radius:12px; padding:10px 16px; font-weight:700; background:linear-gradient(90deg,#6BFF9C,#35EC7C); color:#04140B; white-space:nowrap}
  #wallet.on{background:var(--panel2); color:var(--neon); border:1px solid var(--line)}

  /* ---------- sidebar ---------- */
  .nav{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid transparent; border-radius:12px; background:transparent; color:var(--ink); text-align:start}
  .nav:hover{background:var(--panel)}
  .nav[aria-current="page"]{background:linear-gradient(90deg,rgba(77,255,145,.2),rgba(77,255,145,.06)); border-color:var(--line); color:var(--neon)}
  @media (max-width:860px){ .nav{flex-direction:column; gap:2px; padding:6px 14px; font-size:12px} }

  /* ---------- panels ---------- */
  .panel{background:linear-gradient(180deg,var(--panel),#08110E); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:0 0 28px rgba(77,255,145,.06)}
  .panel h3{margin:0 0 8px; font-size:17px}
  .hero{position:relative; overflow:hidden; padding:22px 20px; min-height:170px}
  .hero .eyebrow{font-size:12px; letter-spacing:.22em; color:var(--neon)}
  .hero h2{margin:4px 0 6px; font-size:clamp(30px,6vw,46px); line-height:1.05; font-weight:800}
  .hero h2 span{color:var(--neon)}
  .hero p{margin:0 0 14px; color:var(--muted); max-width:34ch}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .pill{font-size:12px; padding:5px 10px; border-radius:10px; border:1px solid var(--line); background:rgba(77,255,145,.06); color:var(--ink); display:inline-flex; align-items:center; gap:6px}
  .pill.warnp{border-color:rgba(242,217,139,.4); color:var(--warn); background:rgba(242,217,139,.07)}
  .orb{position:absolute; inset-inline-end:-20px; top:-10px; width:260px; height:200px; pointer-events:none; opacity:.9}
  @media (max-width:640px){ .orb{opacity:.35} }

  /* ---------- tabs + swap form ---------- */
  .tabs{display:flex; gap:8px; margin-bottom:14px}
  .tab{display:flex; align-items:center; gap:8px; padding:10px 18px; border-radius:12px; border:1px solid var(--line2); background:transparent; color:var(--muted)}
  .tab[aria-selected="true"]{border-color:var(--neon); background:rgba(77,255,145,.12); color:var(--ink)}
  .field{background:var(--panel2); border:1px solid var(--line2); border-radius:12px; padding:12px 14px}
  .field label{font-weight:700; display:block}
  .field small{color:var(--muted); display:block; margin-bottom:8px}
  .tokrow{display:flex; flex-direction:column; gap:8px}
  select.tok,.in{width:100%; background:#08140F; color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit}
  .flipwrap{display:flex; justify-content:center; margin:-14px 0; position:relative; z-index:1}
  .flip{width:42px; height:42px; border-radius:50%; border:1px solid var(--neon); background:var(--bg); color:var(--neon); display:grid; place-items:center; box-shadow:0 0 14px rgba(77,255,145,.25)}
  .recvrow{display:flex; align-items:center; gap:10px; margin-top:10px; font-size:14px}
  .recvrow .muted{color:var(--muted)}
  .cta{width:100%; margin-top:14px; padding:14px; border:0; border-radius:12px; font-weight:800; font-size:16px; background:linear-gradient(90deg,#7BFFA8,#35EC7C); color:#04140B; box-shadow:0 0 22px rgba(77,255,145,.25)}
  .fmsg{margin-top:10px; font-size:14px; color:var(--muted); min-height:1px}
  .fmsg.err{color:var(--bad)}
  .gap{display:flex; flex-direction:column; gap:12px}
  .ico{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:800; color:#04140B; flex:none}

  /* ---------- chat ---------- */
  #log{height:min(52vh,420px); overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:2px 2px 10px}
  .msg{max-width:90%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word}
  .me{align-self:flex-end; background:#12432A; border:1px solid var(--line)}
  .bot{align-self:flex-start; background:var(--panel2); border:1px solid var(--line2)}
  .err{color:var(--bad)}
  #bar{display:flex; gap:8px; margin-top:8px}
  #inp{flex:1; min-width:0}
  #send{padding:0 18px; border:0; border-radius:12px; font-weight:800; background:linear-gradient(90deg,#7BFFA8,#35EC7C); color:#04140B}

  /* ---------- preview card ---------- */
  .preview{align-self:stretch; background:#08140F; border:1.5px solid var(--neon); border-radius:12px; padding:14px; margin-top:12px; box-shadow:0 0 22px rgba(77,255,145,.15)}
  .preview h2{font-size:16px; margin:0 0 10px}
  .sell,.buy{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .sub{font-size:12px; color:var(--muted)}
  .big{font-size:22px; font-weight:800}
  .arrow{color:var(--muted); margin:2px 0}
  dl{margin:12px 0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13px}
  dt{color:var(--muted)} dd{margin:0; text-align:end; word-break:break-all}
  .warn{background:rgba(242,217,139,.1); color:var(--warn); border-radius:8px; padding:8px 10px; font-size:12px; margin-bottom:12px}
  .warn.risk{background:rgba(255,122,102,.12); color:#FFB8AA}
  .warn.risk ul{margin:4px 0 0; padding-inline-start:18px}
  .links{font-size:13px; margin-bottom:12px; display:flex; flex-direction:column; gap:2px}
  .links a{color:var(--neon)}
  .ack{display:flex; gap:8px; align-items:flex-start; font-size:13px; margin-bottom:12px}
  .ack input{margin-top:3px; width:18px; height:18px; flex:none; accent-color:var(--neon)}
  .row{display:flex; gap:8px}
  .row button{flex:1; padding:12px; border-radius:10px; font-weight:700; border:1.5px solid var(--neon)}
  .ok{background:var(--neon); color:#04140B}
  .no{background:transparent; color:var(--neon)}
  .preview.done{opacity:.5; pointer-events:none}

  /* ---------- rail ---------- */
  ul.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column}
  ul.list li{border-top:1px solid var(--line2)}
  ul.list li:first-child{border-top:0}
  .net{width:100%; display:flex; align-items:center; gap:12px; padding:11px 2px; background:transparent; border:0; text-align:start}
  .net .nm{flex:1; min-width:0}
  .net .nm small{display:block; color:var(--muted); font-size:12px}
  .net .st{font-size:12px; color:var(--neon); background:rgba(77,255,145,.12); border-radius:8px; padding:3px 10px}
  .hist{display:flex; align-items:center; gap:12px; padding:11px 2px}
  .hist .nm{flex:1; min-width:0}
  .hist .nm small{display:block; color:var(--neon); font-size:12px}
  .hist .tm{font-size:12px; color:var(--muted); text-align:end}
  .empty{color:var(--muted); font-size:14px; margin:4px 0}
  .promo{display:flex; gap:12px; align-items:center}
  .promo p{margin:0; color:var(--muted); font-size:14px}
  .promo h3{margin-bottom:4px}

  /* ---------- why strip ---------- */
  .why{display:grid; grid-template-columns:1.3fr repeat(4,1fr); gap:14px; align-items:center}
  .why h3{margin:0; font-size:16px}
  .why p{margin:2px 0 0; color:var(--muted); font-size:13px}
  .why .it{display:flex; gap:10px; align-items:flex-start}
  .why .it svg{color:var(--neon); margin-top:2px}
  .why .it b{display:block; font-size:13px}
  .why .it span{font-size:12px; color:var(--muted)}
  @media (max-width:1180px){ .why{grid-template-columns:1fr 1fr} .why > :first-child{grid-column:1/-1} }

  /* ---------- sheet ---------- */
  #sheetWrap{position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:flex-end; justify-content:center; z-index:20}
  #sheetWrap[hidden]{display:none}
  .sheet{background:var(--panel); border:1px solid var(--line); width:100%; max-width:600px; max-height:88vh; overflow-y:auto; padding:20px 20px 24px; border-radius:16px 16px 0 0}
  @media (min-width:861px){ #sheetWrap{align-items:center} .sheet{border-radius:16px} }
  .sheet h2{font-size:22px; margin:0 0 8px}
  .sheet h3{font-size:16px; margin:18px 0 4px; color:var(--neon)}
  .sheet p,.sheet li{font-size:14px; margin:4px 0; color:var(--ink)}
  .sheet ol,.sheet ul{padding-inline-start:20px; margin:4px 0}
  .sheet .close{width:100%; margin-top:18px; padding:12px; border-radius:10px; border:1.5px solid var(--neon); background:var(--neon); color:#04140B; font-weight:800}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v10a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2zM16 14h2"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-logo" viewBox="0 0 40 40"><path d="M20 3l6 11 11 6-11 6-6 11-6-11L3 20l11-6z" fill="none" stroke="#4DFF91" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="20" r="3.2" fill="#4DFF91"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="38" height="38" aria-hidden="true"><use href="#i-logo"/></svg>
      <span class="wm">SWAP<b>LY</b></span>
      <span class="tag" data-i18n="tagline"></span>
    </div>
    <div class="topr">
      <label class="netsel"><span class="dot"></span><select id="chainSel" aria-label="Network"></select></label>
      <button id="wallet"><svg class="i"><use href="#i-wallet"/></svg><span id="walletTxt"></span></button>
    </div>
  </header>

  <nav class="side" aria-label="Main">
    <button class="nav" id="navSwap" aria-current="page"><svg class="i"><use href="#i-swap"/></svg><span data-i18n="navSwap"></span></button>
    <button class="nav" id="navHistory"><svg class="i"><use href="#i-clock"/></svg><span data-i18n="navHistory"></span></button>
    <button class="nav" id="navAbout"><svg class="i"><use href="#i-info"/></svg><span data-i18n="navAbout"></span></button>
  </nav>

  <main>
    <section class="panel hero">
      <svg class="orb" viewBox="0 0 260 200" aria-hidden="true">
        <defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#4DFF91" stop-opacity=".55"/><stop offset="1" stop-color="#4DFF91" stop-opacity="0"/></radialGradient></defs>
        <circle cx="150" cy="100" r="95" fill="url(#g)"/>
        <ellipse cx="150" cy="100" rx="105" ry="38" fill="none" stroke="#4DFF91" stroke-opacity=".35" transform="rotate(-18 150 100)"/>
        <ellipse cx="150" cy="100" rx="105" ry="38" fill="none" stroke="#4DFF91" stroke-opacity=".2" transform="rotate(24 150 100)"/>
        <path d="M150 55l22 33 33 12-33 12-22 33-22-33-33-12 33-12z" fill="#07130E" stroke="#4DFF91" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="150" cy="100" r="7" fill="#4DFF91"/>
      </svg>
      <div class="eyebrow" data-i18n="heroEyebrow"></div>
      <h2>Swap <span data-i18n="heroTitle2"></span></h2>
      <p data-i18n="heroSub"></p>
      <div class="chips">
        <span class="pill"><svg class="i" style="width:14px;height:14px"><use href="#i-globe"/></svg><span data-i18n="chipLang"></span></span>
        <span class="pill"><svg class="i" style="width:14px;height:14px"><use href="#i-bolt"/></svg><span data-i18n="chipChains"></span></span>
        <span class="pill"><svg class="i" style="width:14px;height:14px"><use href="#i-shield"/></svg><span data-i18n="chipSafe"></span></span>
        <span class="pill warnp"><svg class="i" style="width:14px;height:14px"><use href="#i-info"/></svg><span data-i18n="stepNote"></span></span>
      </div>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist" hidden>
        <button class="tab" id="tabSwap" role="tab" aria-selected="true"><svg class="i"><use href="#i-swap"/></svg><span data-i18n="tabSwap"></span></button>
        <button class="tab" id="tabChat" role="tab" aria-selected="false"><svg class="i"><use href="#i-chat"/></svg><span data-i18n="tabChat"></span></button>
      </div>

      <div id="paneSwap">
        <div class="gap">
          <div class="field">
            <label for="fromSel" data-i18n="fromLabel"></label><small data-i18n="fromHint"></small>
            <div class="tokrow"><select class="tok" id="fromSel"></select><input class="in" id="fromAddr" hidden autocomplete="off" spellcheck="false"></div>
          </div>
          <div class="flipwrap"><button class="flip" id="flip" aria-label="Flip"><svg class="i"><use href="#i-flip"/></svg></button></div>
          <div class="field">
            <label for="toSel" data-i18n="toLabel"></label><small data-i18n="toHint"></small>
            <div class="tokrow"><select class="tok" id="toSel"></select><input class="in" id="toAddr" hidden autocomplete="off" spellcheck="false"></div>
          </div>
          <div class="field">
            <label for="amt" data-i18n="amountLabel"></label><small data-i18n="amountHint"></small>
            <input class="in" id="amt" inputmode="decimal" autocomplete="off" placeholder="10">
            <div class="recvrow"><span class="muted" data-i18n="receiveLabel"></span><b id="recv">—</b></div>
          </div>
        </div>
        <button class="cta" id="previewBtn"></button>
        <div class="fmsg" id="formMsg" aria-live="polite"></div>
        <div id="slot"></div>
      </div>

      <div id="paneChat" hidden>
        <div id="log" aria-live="polite"></div>
        <div id="bar"><input class="in" id="inp" autocomplete="off"><button id="send"></button></div>
      </div>
    </section>

    <section class="panel why">
      <div><h3 data-i18n="whyTitle"></h3><p data-i18n="whyDesc"></p></div>
      <div class="it"><svg class="i"><use href="#i-globe"/></svg><div><b data-i18n="why1H"></b><span data-i18n="why1"></span></div></div>
      <div class="it"><svg class="i"><use href="#i-shield"/></svg><div><b data-i18n="why2H"></b><span data-i18n="why2"></span></div></div>
      <div class="it"><svg class="i"><use href="#i-check"/></svg><div><b data-i18n="why3H"></b><span data-i18n="why3"></span></div></div>
      <div class="it"><svg class="i"><use href="#i-bolt"/></svg><div><b data-i18n="why4H"></b><span data-i18n="why4"></span></div></div>
    </section>
  </main>

  <aside class="rail">
    <section class="panel"><h3 data-i18n="railNetworks"></h3><ul class="list" id="netList"></ul></section>
    <section class="panel"><h3 data-i18n="railRecent"></h3><ul class="list" id="recent"></ul></section>
    <section class="panel promo">
      <svg class="i" style="width:34px;height:34px;color:var(--neon)"><use href="#i-shield"/></svg>
      <div><h3 data-i18n="promoTitle"></h3><p data-i18n="promoText"></p></div>
    </section>
  </aside>
</div>

<div id="sheetWrap" hidden role="dialog" aria-modal="true">
  <div class="sheet"><div id="sheetBody"></div><button class="close" id="sheetClose"></button></div>
</div>

<script>

/* ============ LLM helper ============ */
// Works inside Claude artifacts (no key needed). When opened as a plain file,
// the browser has no key: set one with  localStorage.setItem("swaply_key","sk-ant-...")  in the console.
function extractJSON(raw){
  const clean = raw.replace(/```json|```/g, "").trim();
  try{ return JSON.parse(clean); }catch(_){}
  const a = clean.indexOf("{"), b = clean.lastIndexOf("}");
  if (a >= 0 && b > a) return JSON.parse(clean.slice(a, b + 1));
  throw new Error("LLM did not return JSON");
}
async function callClaude(system, user){
  const headers = { "Content-Type":"application/json" };
  let key = null;
  try{ key = localStorage.getItem("swaply_key"); }catch(_){}
  if (key){
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  let res;
  try{
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers,
      body: JSON.stringify({ model:MODEL, max_tokens:1000, system, messages:[{ role:"user", content:user }] })
    });
  }catch(e){ throw new Error("Cannot reach the LLM (network/CORS or no API key)"); }
  let data;
  try{ data = await res.json(); }catch(_){ throw new Error("LLM returned an invalid response (HTTP " + res.status + ")"); }
  if (!res.ok || data.error || !Array.isArray(data.content))
    throw new Error((data.error && data.error.message) || ("LLM request failed (HTTP " + res.status + ")"));
  const raw = data.content.map(b => b.type === "text" ? b.text : "").join("");
  return extractJSON(raw);
}

/* ============ Language switching ============ */
async function setLang(name){
  const key = name.toLowerCase();
  if (!cache[key]){
    try{
      const sys = `Translate the string values of the JSON object into ${name}. Keep keys unchanged. Keep {placeholders} like {msg} and tokens like USDC, ETH, BNB, SOL, Base, Ethereum, Solana, MetaMask, Phantom, GeckoTerminal, GoPlus, Swaply, and "$" exactly as they are. Return ONLY the JSON object.`;
      const keys = Object.keys(EN), chunks = [];
      for (let i = 0; i < keys.length; i += 8) chunks.push(keys.slice(i, i + 8));
      const parts = await Promise.all(chunks.map(ks =>
        callClaude(sys, JSON.stringify(Object.fromEntries(ks.map(k => [k, EN[k]])))).catch(() => ({}))
      ));
      const tr = Object.assign({}, ...parts);
      const ok = {};
      for (const k in EN){
        const need = (EN[k].match(/\{\w+\}/g) || []);
        if (typeof tr[k] === "string" && need.every(p => tr[k].includes(p))) ok[k] = tr[k];
      }
      cache[key] = { ...EN, ...ok };
    }catch(e){ cache[key] = EN; }
  }
  langName = name; S = cache[key];
  applyStatic();
}

/* ============ GeckoTerminal (public, keyless) ============ */
const gtCache = {};
async function gtGet(net, path){
  const url = "https://api.geckoterminal.com/api/v2/networks/" + net + path;
  const c = gtCache[url];
  if (c && Date.now() - c.t < 60000) return c.d;
  const r = await fetch(url);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("GeckoTerminal " + r.status);
  const d = await r.json();
  gtCache[url] = { t: Date.now(), d };
  return d;
}
async function builtIn(ch, k){
  const def = TOKENS[ch][k];
  const tok = { symbol:k, address:def.address, id: def.address === "native" ? "native:" + k : norm(ch, def.address),
                custom:false, usd:SAMPLE_USD[k], live:false, risks:[] };
  try{
    const pr = def.price || { net: CHAINS[ch].gt, addr: def.address };
    const d = await gtGet(pr.net, "/tokens/" + pr.addr);
    const p = parseFloat(d?.data?.attributes?.price_usd);
    if (p > 0){ tok.usd = p; tok.live = true; }
  }catch(e){ /* keep sample price */ }
  return tok;
}

/* ============ Security scan (GoPlus, public, keyless) ============ */
const jsonCache = {};
async function jsonGet(url){
  const c = jsonCache[url];
  if (c && Date.now() - c.t < 120000) return c.d;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try{
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    jsonCache[url] = { t: Date.now(), d };
    return d;
  } finally { clearTimeout(timer); }
}
async function securityScan(ch, addr){
  try{
    const c = CHAINS[ch];
    const url = c.type === "solana"
      ? "https://api.gopluslabs.io/api/v1/solana/token_security?contract_addresses=" + encodeURIComponent(addr)
      : "https://api.gopluslabs.io/api/v1/token_security/" + c.gp + "?contract_addresses=" + addr;
    const d = await jsonGet(url);
    const r = d?.result?.[addr];
    return r && typeof r === "object" && Object.keys(r).length ? r : null;
  }catch(e){ return null; }
}
function evalSecurity(ch, r){
  const risks = [];
  const is1 = k => r[k] === "1" || r[k] === 1;
  if (CHAINS[ch].type === "solana"){
    if (r.mintable === undefined && r.freezable === undefined) return null;
    if (is1("non_transferable")) return { block:"blockCantTrade", vars:{}, risks };
    if (String(r.mintable?.status) === "1") risks.push(["riskSolMint", {}]);
    if (String(r.freezable?.status) === "1") risks.push(["riskSolFreeze", {}]);
    return { block:null, vars:{}, risks };
  }
  if (is1("is_honeypot") || is1("cannot_sell_all") || is1("cannot_buy")) return { block:"blockCantTrade", vars:{}, risks };
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const tax = Math.max(num(r.buy_tax), num(r.sell_tax));
  if (tax > MAX_TAX_BLOCK) return { block:"blockTax", vars:{ pct: fmt(tax * 100, 1) }, risks };
  if (tax >= TAX_WARN) risks.push(["riskTax", { pct: fmt(tax * 100, 1) }]);
  if (is1("is_mintable")) risks.push(["riskMint", {}]);
  if (is1("hidden_owner") || is1("can_take_back_ownership")) risks.push(["riskOwner", {}]);
  if (is1("is_blacklisted") || is1("transfer_pausable")) risks.push(["riskBlacklist", {}]);
  if (is1("slippage_modifiable") || is1("personal_slippage_modifiable")) risks.push(["riskSlip", {}]);
  if (is1("is_proxy")) risks.push(["riskProxy", {}]);
  if (r.is_open_source === "0" || r.is_open_source === 0) risks.push(["riskClosed", {}]);
  return { block:null, vars:{}, risks };
}

async function loadCustom(ch, addr){
  const known = Object.keys(TOKENS[ch]).find(k => TOKENS[ch][k].address !== "native" && norm(ch, TOKENS[ch][k].address) === addr);
  if (known) return builtIn(ch, known);
  const net = CHAINS[ch].gt;
  let tk, pools, raw;
  try{
    [tk, pools, raw] = await Promise.all([
      gtGet(net, "/tokens/" + addr),
      gtGet(net, "/tokens/" + addr + "/pools?page=1"),
      securityScan(ch, addr)
    ]);
  }catch(e){ return { error: t("tokenLookupFail") }; }
  const a = tk?.data?.attributes;
  const price = parseFloat(a?.price_usd);
  if (!a || !(price > 0)) return { error: t("tokenNotFound") };
  let liq = 0, created = null;
  (pools?.data || []).forEach(p => {
    const r = parseFloat(p.attributes?.reserve_in_usd) || 0;
    if (r > liq){ liq = r; created = p.attributes?.pool_created_at || null; }
  });
  if (liq < BLOCK_LIQ_USD) return { error: t("blockLiq", { n: fmt(liq, 0), min: fmt(BLOCK_LIQ_USD, 0) }) };
  const ev = raw ? evalSecurity(ch, raw) : null;
  if (ev?.block) return { error: t(ev.block, ev.vars) };

  const ageDays = created ? (Date.now() - new Date(created).getTime()) / 86400000 : null;
  const vol = parseFloat(a.volume_usd?.h24) || 0;
  const symbol = String(a.symbol || "?").slice(0, 12);
  const risks = [];
  if (liq < 10000) risks.push(["riskLowLiq", { n: fmt(liq, 0) }]);
  else if (liq < 50000) risks.push(["riskMedLiq", { n: fmt(liq, 0) }]);
  if (ageDays !== null && ageDays < 7) risks.push(["riskNewPool", { n: fmt(ageDays, 1) }]);
  if (vol <= 0) risks.push(["riskNoVol", {}]);
  const clash = Object.keys(TOKENS[ch]).find(k => k === symbol.toUpperCase());
  if (clash) risks.push(["riskSymbol", { sym: clash }]);
  if (ev) risks.push(...ev.risks);
  else {
    risks.push(["riskScanUnavailable", {}]);
    if (ch === "solana") risks.push(["riskSolana", {}]);
  }
  if (ch === "robinhood") risks.push(["riskRobinhood", {}]);
  risks.push(["riskScanLimit", {}]);
  return { symbol, address: addr, id: addr, custom:true, usd:price, live:true, liq, ageDays, scanned: !!ev, risks };
}

async function resolveToken(sym, rawAddrs, ch){
  const m = /^TOKEN_([AB])$/i.exec(String(sym || "").trim());
  if (m){
    const raw = rawAddrs["AB".indexOf(m[1].toUpperCase())];
    if (!raw || !validAddr(ch, raw)) return { error: t("addrWrongChain", { chain: CHAINS[ch].name }) };
    return loadCustom(ch, norm(ch, raw));
  }
  const k = String(sym || "").toUpperCase();
  return TOKENS[ch][k] ? builtIn(ch, k) : { error: t("badToken", { chain: CHAINS[ch].name, list: listTokens(ch) }) };
}

/* ============ Fast path: simple commands skip the LLM ============ */
const CHAIN_WORDS = {
  base:"base", ethereum:"ethereum", mainnet:"ethereum", "ethereum mainnet":"ethereum",
  bnb:"bnb", bsc:"bnb", "bnb chain":"bnb", solana:"solana",
  robinhood:"robinhood", "robinhood chain":"robinhood"
};
const FAST_FILLER = /\b(please|pls|paki|palitan|ipalit|i-?swap|swap|convert|exchange|trade|sell|ko|ng|na|ang|mo|naman|gusto|want|to|i|would|like|can|you|could)\b/gi;
function fastParse(masked){
  const known = new Set([...Object.values(TOKENS).flatMap(o => Object.keys(o)), "TOKEN_A", "TOKEN_B"]);
  let txt = masked.toLowerCase().replace(/,(?=\d{3})/g, "");
  let chainKey = null;
  const cm = /\b(?:on|sa|in)\s+(ethereum mainnet|bnb chain|robinhood chain|base|ethereum|mainnet|bnb|bsc|solana|robinhood)\s*[.!]?\s*$/.exec(txt);
  if (cm){ chainKey = CHAIN_WORDS[cm[1]]; txt = txt.slice(0, cm.index); }
  // buy X with N Y  ->  from Y to X
  let m = /\bbuy\s+([a-z_]{2,10})\s+with\s+(\d+(?:\.\d+)?)\s*([a-z_]{2,10})/.exec(txt);
  let from, to, amount;
  if (m){ to = m[1]; amount = Number(m[2]); from = m[3]; }
  else{
    m = /(\d+(?:\.\d+)?)\s*([a-z_]{2,10})\s*(?:to|for|into|sa|para|->|=>|→)\s*([a-z_]{2,10})\b/.exec(txt);
    if (!m) return null;
    amount = Number(m[1]); from = m[2]; to = m[3];
    // reject if there is unexplained leftover text (let the LLM handle it)
    const left = (txt.slice(0, m.index) + " " + txt.slice(m.index + m[0].length)).replace(FAST_FILLER, "").replace(/[^a-z0-9_]/g, "");
    if (left) return null;
  }
  from = from.toUpperCase(); to = to.toUpperCase();
  if (!known.has(from) || !known.has(to) || !isFinite(amount)) return null;
  return { intent:"swap", lang:null, chain:chainKey, from, to, amount };
}

/* ============ LLM: intent parsing (any language) ============ */
const SYSTEM = () => `You are the intent parser for a crypto swap assistant.
Networks (use these exact ids): base, ethereum, bnb, solana, robinhood. The user currently has "${chain}" selected.
Known tokens by network: ${JSON.stringify(Object.fromEntries(Object.entries(TOKENS).map(([c, o]) => [c, Object.keys(o)])))}.
Users may also refer to custom tokens by the placeholders TOKEN_A and TOKEN_B (they stand for contract addresses). Use those placeholders exactly in "from"/"to".
The user may write in ANY language. Detect it.
Reply with ONLY a JSON object, no markdown, no extra text. Schema:
{"lang":"English name of the user's language, e.g. Spanish, Filipino, Japanese","intent":"swap"|"chat","chain":"network id or null","from":"TOKEN","to":"TOKEN","amount":number,"reply":"short friendly message written in the user's language"}
Rules:
- Set "chain" only if the user names a network, otherwise null.
- A swap happens on ONE network. If the user wants to move or swap between different networks (cross-chain), use "chat" and explain that this is not supported.
- Token symbols stay in Latin letters (USDC, ETH...), even in other languages.
- Use "swap" only if the user clearly wants to swap/convert/buy/sell and gave a token pair and a numeric amount.
- If anything is missing or unclear, use "chat" and ask for the missing piece in "reply".
- Never invent amounts or tokens. Never give financial advice.`;

/* ============ Validation (code decides, not the LLM) ============ */
function validate(from, to, amount){
  if (from.id === to.id) return t("sameToken");
  if (!isFinite(amount) || amount <= 0) return t("badAmount");
  const custom = from.custom || to.custom;
  const cap = custom ? CUSTOM_MAX_USD : MAX_SWAP_USD;
  if (amount * from.usd > cap) return t(custom ? "customCap" : "overCap", { cap });
  return null;
}
function getQuote(from, to, amount){
  const usd = amount * from.usd;
  const fee = usd * FEE_BPS / 10000;
  return { out:(usd - fee) / to.usd, rate:from.usd / to.usd, feeUsd:fee };
}

/* ============ Jupiter quote (Solana, built-in tokens, quote only) ============ */
// Needs:  localStorage swaply_jup_key (Jupiter API key)  and  swaply_ref (your referralAccount).
// No "taker" is sent, so Jupiter returns a price only. Nothing can be signed or executed here.
async function jupiterQuote(from, to, amount){
  const key = ls("swaply_jup_key");
  if (chain !== "solana" || !key || from.custom || to.custom) return null;
  const dIn = JUP_DEC[from.symbol], dOut = JUP_DEC[to.symbol];
  if (dIn == null || dOut == null) return null;
  const mint = tk => tk.address === "native" ? WSOL : tk.address;
  const params = new URLSearchParams({
    inputMint: mint(from), outputMint: mint(to),
    amount: String(Math.round(amount * 10 ** dIn))
  });
  const ref = ls("swaply_ref");
  if (ref){ params.set("referralAccount", ref); params.set("referralFee", String(FEE_BPS)); }
  try{
    const r = await fetch(JUP_BASE + "/order?" + params, { headers: { "x-api-key": key } });
    if (!r.ok) return null;
    const o = await r.json();
    const out = Number(o.outAmount) / 10 ** dOut;
    if (!(out > 0)) return null;
    const bps = Number(o.feeBps) || 0;
    return { out, rate: out / amount, feeUsd: amount * from.usd * bps / 10000, feeBps: bps, live: true };
  }catch(_){ return null; }
}

/* ============ REAL swap: Jupiter /order (with taker) -> wallet signs -> /execute ============ */
const LIVE_MAX_USD = 25;        // hard cap per live swap while you test
const MAX_DEVIATION = 0.01;     // abort if the executable quote is >1% worse than the preview
const liveReady = res => res.ch === "solana" && !demo.solana && !!accounts.solana
  && ls("swaply_live") === "1" && !!ls("swaply_jup_key")
  && !res.from.custom && !res.to.custom && res.q.live === true;

function loadWeb3(){
  if (window.solanaWeb3) return Promise.resolve(window.solanaWeb3);
  return new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "https://cdn.jsdelivr.net/npm/@solana/web3.js@1.98.0/lib/index.iife.min.js";
    sc.onload = () => window.solanaWeb3 ? ok(window.solanaWeb3) : no(new Error("web3.js failed to load"));
    sc.onerror = () => no(new Error("web3.js could not be loaded"));
    document.head.appendChild(sc);
  });
}
const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const bytesToB64 = u => { let s = ""; u.forEach(x => s += String.fromCharCode(x)); return btoa(s); };

async function executeLive(res, say){
  const { from, to, amount, q } = res;
  const usd = amount * from.usd;
  if (usd > LIVE_MAX_USD){ say(t("execMax", { cap: LIVE_MAX_USD }), true); return; }
  const sol = window.phantom?.solana || (window.solana?.isPhantom ? window.solana : null);
  if (!sol){ say(t("noPhantom"), true); return; }
  const key = ls("swaply_jup_key"), ref = ls("swaply_ref");
  const mint = tk => tk.address === "native" ? WSOL : tk.address;
  const params = new URLSearchParams({
    inputMint: mint(from), outputMint: mint(to),
    amount: String(Math.round(amount * 10 ** JUP_DEC[from.symbol])),
    taker: accounts.solana
  });
  if (ref){ params.set("referralAccount", ref); params.set("referralFee", String(FEE_BPS)); }
  try{
    const r = await fetch(JUP_BASE + "/order?" + params, { headers: { "x-api-key": key } });
    const o = await r.json();
    if (!r.ok) throw new Error(o.error || o.message || ("HTTP " + r.status));
    if (!o.transaction) throw new Error(o.errorMessage || "no transaction returned");
    // Safety checks BEFORE anything is signed
    const out = Number(o.outAmount) / 10 ** JUP_DEC[to.symbol];
    if (!(out >= q.out * (1 - MAX_DEVIATION))){ say(t("execStale"), true); return; }
    if ((Number(o.feeBps) || 0) > FEE_BPS + 25){ say(t("execFee"), true); return; }

    const web3 = await loadWeb3();
    const tx = web3.VersionedTransaction.deserialize(b64ToBytes(o.transaction));
    say(t("execSigning"), false);
    const signed = await sol.signTransaction(tx);
    say(t("execSending"), false);
    const er = await fetch(JUP_BASE + "/execute", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-api-key": key },
      body: JSON.stringify({ signedTransaction: bytesToB64(signed.serialize()), requestId: o.requestId })
    });
    const ex = await er.json();
    if (ex.status === "Success" && ex.signature){
      say(t("execOk") + " https://solscan.io/tx/" + ex.signature, false);
    } else {
      say(t("execFail", { msg: ex.error || ("code " + ex.code) }), true);
    }
  }catch(e){
    say(t("execFail", { msg: e.message || "cancelled" }), true);
  }
}

/* One pipeline for both the form and the chat */
async function runSwap({ fromSym, toSym, rawAddrs, amount }){
  const ch = chain;
  const [from, to] = await Promise.all([resolveToken(fromSym, rawAddrs, ch), resolveToken(toSym, rawAddrs, ch)]);
  const bad = from.error || to.error;
  if (bad) return { error: bad };
  const problem = validate(from, to, amount);
  if (problem) return { error: problem };
  const swapUsd = amount * from.usd;
  [from, to].filter(x => x.custom && x.liq > 0).forEach(x => {
    const pct = swapUsd / x.liq * 100;
    if (pct >= 2) x.risks.unshift(["riskImpact", { pct: fmt(pct, 1) }]);
  });
  const q = (await jupiterQuote(from, to, amount)) || getQuote(from, to, amount);
  return { ch, from, to, amount, q };
}

/* ============ Chat flow ============ */
const sayChat = (txt, err) => add(txt, "bot" + (err ? " err" : ""));
async function handle(){
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ""; add(text, "me");
  sendBtn.disabled = true;
  const wait = add("…", "bot");
  try{
    // Contract addresses never go to the LLM; it only sees TOKEN_A / TOKEN_B placeholders.
    const found = [...(text.match(/0x[a-fA-F0-9]{40}/g) || []), ...(text.match(/\b[1-9A-HJ-NP-Za-km-z]{32,44}\b/g) || [])];
    const addrs = [...new Set(found)].slice(0, 2);
    let masked = text;
    addrs.forEach((a, i) => { masked = masked.split(a).join("TOKEN_" + "AB"[i]); });

    const intent = fastParse(masked) || await callClaude(SYSTEM(), masked);
    if (intent.lang && intent.lang.toLowerCase() !== langName.toLowerCase()) await setLang(intent.lang).catch(() => {});
    if (intent.intent !== "swap"){ wait.remove(); add(intent.reply || t("askSwap"), "bot"); return; }

    if (!intent.from || !intent.to || !isFinite(Number(intent.amount))){ wait.remove(); add(intent.reply || t("askSwap"), "bot"); return; }
    if (CHAINS[intent.chain]) setChain(intent.chain, true);
    wait.textContent = t("checking");
    const res = await runSwap({ fromSym:intent.from, toSym:intent.to, rawAddrs:addrs, amount:Number(intent.amount) });
    wait.remove();
    if (res.error){ add(res.error, "bot err"); return; }
    if (intent.reply) add(intent.reply, "bot");
    showPreview(res, log, sayChat);
  }catch(e){
    wait.remove();
    add(t("error", { msg: e.message }), "bot err");
  }finally{
    sendBtn.disabled = false; inp.focus();
  }
}
sendBtn.onclick = handle;
inp.addEventListener("keydown", e => { if (e.key === "Enter") handle(); });
